[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "nfl-analytics"
version = "0.1.0"
description = "Self-hosted NFL analytics platform: nflverse data in DuckDB, a dashboard, and an MCP server for Claude."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Chihlas, Inc." }]
dependencies = [
    "duckdb>=1.1,<2",
    "httpx>=0.27,<1",
    "apscheduler>=3.10,<4",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "defusedxml>=0.7,<1",
]
dev = [
    "nfl-analytics[api]",
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
nfl = "nfl_analytics.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nfl_analytics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m \"not network\""
markers = [
    "network: downloads real nflverse data (slow; run with -m network)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
ignore_missing_imports = true
