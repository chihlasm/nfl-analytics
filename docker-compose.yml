# NFL Analytics stack for docker-01. Manage it in Dockge or with `docker compose`.
#
#   ingest  the ONLY writer: downloads nflverse data each morning, publishes nfl.duckdb
#   api     read-only FastAPI over nfl.duckdb + the news headline reader
#   web     Caddy serving the dashboard and proxying /api; joins the homelab
#           reverse-proxy network so the homelab Caddy can reach it at nfl-web:8080
#
# Nothing here publishes a host port. Reach the dashboard through the homelab Caddy
# at nfl.chihlas.com (Tailscale only; see README "Deploy").
#
# Images are built locally and tagged :local (never :latest), and Watchtower is
# disabled for every service: updates arrive deliberately with `git pull` + rebuild.

name: nfl-analytics

x-no-watchtower: &no-watchtower
  com.centurylinklabs.watchtower.enable: "false"

x-hardened: &hardened
  read_only: true
  tmpfs: [/tmp]
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  ingest:
    build:
      context: .
      dockerfile: services/ingest/Dockerfile
    image: nfl-analytics-ingest:local
    container_name: nfl-ingest
    restart: unless-stopped
    init: true
    user: "${PUID:-1000}:${PGID:-1000}"
    env_file:
      - path: .env
        required: false
    environment:
      TZ: America/New_York
      NFL_DATA_DIR: /data
    volumes:
      - ${NFL_DATA_HOST_DIR:-./data}:/data
    # Downloads from GitHub; talks to no other container (they share files, not sockets).
    networks: [outbound]
    mem_limit: 8g
    logging: *logging
    labels: *no-watchtower

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    image: nfl-analytics-api:local
    container_name: nfl-api
    restart: unless-stopped
    init: true
    user: "${PUID:-1000}:${PGID:-1000}"
    env_file:
      - path: .env
        required: false
    environment:
      TZ: America/New_York
      NFL_DATA_DIR: /data
    volumes:
      # Read-only: the API can never change the data.
      - ${NFL_DATA_HOST_DIR:-./data}:/data:ro
    # internal: talks to web. outbound: fetches news RSS feeds.
    networks: [internal, outbound]
    mem_limit: 2g
    logging: *logging
    labels: *no-watchtower
    <<: *hardened

  web:
    build: ./web
    image: nfl-analytics-web:local
    container_name: nfl-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      TZ: America/New_York
    networks: [internal, homelab]
    mem_limit: 256m
    logging: *logging
    labels: *no-watchtower
    healthcheck:
      # The dashboard shell is served AND /api reaches the API through this container.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null && wget -qO- http://127.0.0.1:8080/api/health >/dev/null"]
      interval: 1m
      timeout: 5s
      start_period: 15s
      retries: 3
    <<: *hardened
    tmpfs: [/tmp, /config, /data]

networks:
  internal:
    internal: true
  outbound: {}
  homelab:
    # The network the homelab's main Caddy is on (WePlan uses the same one).
    external: true
    name: ${HOMELAB_NETWORK:-docker_homelab}
