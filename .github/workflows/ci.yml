name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 14 * * 4" # Thursdays 14:00 UTC, after Tuesday-Wednesday charting

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Type check
        run: mypy src
      - name: Unit tests
        run: pytest

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build ingest image
        run: docker build -f services/ingest/Dockerfile -t nfl-analytics-ingest:ci .
      - name: Smoke test CLI
        run: docker run --rm nfl-analytics-ingest:ci --help

  gate:
    # The Phase 1 gate against real nflverse data. Manual or weekly, since it downloads ~500 MB.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -m network
